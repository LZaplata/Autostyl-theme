<div class="link h-100">
    <a href="{{ link ?: item.url }}" class="link__link position-relative d-flex flex-column p-4 gap-5 h-100">
        <div class="row g-3">
            {% if image %}
                <div class="col-auto">
                    <p class="link__img mb-0 position-relative overflow-hidden">
                        {% if image.path %}
                            <img src="{{ image.path }}" alt="{{ image.description }}" class="img-fluid">
                        {% else %}
                            <img src="{{ image|media }}" alt="{{ image.description }}" class="img-fluid">
                        {% endif %}
                    </p>
                </div>
            {% endif %}

            <div class="col">
                <h3 class="link__title mb-0">
                    {{ item.title }}
                </h3>

                {% if item.excerpt or item.perex %}
                    <div class="link__perex mt-2 text">
                        <p class="mb-0">
                            {{ item.excerpt ?: item.perex|raw }}
                        </p>
                    </div>
                {% endif %}
            </div>
        </div>

        <div class="d-flex align-items-center gap-1 fs-4 fw-semibold lh-1 mt-auto">
            Zobrazit nabídku

            <span class="material-symbol__icon">
                keyboard_arrow_right
            </span>
        </div>
    </a>
</div>
