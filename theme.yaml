name: Autostyl
description: 'Theme for Autostyl company from Trutnov.'
author: 'Lukáš Záplata'
homepage: ''
authorCode: LZaplata
code: autostyl
parent: ''
database: '0'
require:
    - initbiz.seostorm
    - rainlab.pages
    - rainlab.blog
    - rainlab.translate
    - janvince.smallgdpr
    - janvince.smallcontactform
    - janvince.smallextensions
    - lzaplata.gallery
    - lzaplata.files
    - lzaplata.extensions
    - lzaplata.pages
    - lzaplata.pricelists
    - lzaplata.openinghours
    - lzaplata.timelines
    - lzaplata.flashmessages
    - vdlp.redirect
form:
    tabs:
        fields:
            logo:
                label: Logo
                type: fileupload
                span: left
                fileTypes: png, svg, webp
                commentAbove: 'Pouze soubory typu PNG, SVG a WEBP jsou povoleny'
                maxFiles: 1
                tab: Nastavení
            logo_sm:
                label: Malé logo
                type: fileupload
                span: right
                fileTypes: png, svg, webp
                commentAbove: 'Pouze soubory typu PNG, SVG a WEBP jsou povoleny'
                commentBelove: 'Toto logo je používané v patičce'
                maxFiles: 1
                tab: Nastavení
            homepage_url:
                label: 'Odkaz na domovskou stránku'
                type: text
                span: left
                comment: 'Ponechte prázdné pro automatický odkaz na domovskou stránku tohoto webu. Vyplňte pro přesměrování na konkrétní URL (např. jiný web).'
                tab: Nastavení
            mainmenu_dropdown:
                label: Zobrazit 2. úroveň hlavního menu
                type: switch
                default: false
                span: left
                tab: Nastavení
            copyright:
                label: Copyright
                type: text
                span: left
                tab: Nastavení
            founder:
                label: Zřizovatel
                type: text
                span: left
                tab: Kontakt
            company:
                label: Firma
                type: text
                span: right
                tab: Kontakt
            phone:
                label: Telefon
                type: text
                span: left
                tab: Kontakt
            phone_published_in:
                label: Publikováno (telefon)
                type: checkboxlist
                tab: Kontakt
                span: right
                options:
                    header: Hlavička
            email:
                label: E-mail
                type: text
                span: left
                tab: Kontakt
            street:
                label: Ulice
                type: text
                span: left
                tab: Kontakt
            street_no:
                label: 'Číslo domu'
                type: text
                span: right
                tab: Kontakt
            city:
                label: Město
                type: text
                span: left
                tab: Kontakt
            zip:
                label: PSČ
                type: text
                span: right
                tab: Kontakt
            country:
                label: Země
                type: text
                span: left
                tab: Kontakt
                translatable: true
            map_link:
                label: 'Odkaz na mapu'
                type: text
                span: right
                tab: Kontakt
            company_id:
                label: IČO
                type: text
                span: left
                tab: Kontakt
            company_vat_id:
                label: DIČ
                type: text
                span: right
                tab: Kontakt
            databox:
                label: Datavá schránka
                type: text
                span: left
                tab: Kontakt
            company_registration:
                label: Registrace
                commentAbove: 'Text k registraci v firmy v živnostenském rejstříku'
                type: textarea
                tab: Kontakt
            bank:
                label: Banka
                type: text
                span: left
                tab: Kontakt
            account_number:
                label: Číslo účtu
                type: text
                span: right
                tab: Kontakt
            socials_published_in:
                label: Publikováno
                type: checkboxlist
                tab: 'Sociální sítě'
                options:
                    header: Hlavička
                    footer: Patička
                default: [footer]
            facebook:
                label: Facebook
                type: text
                span: left
                tab: 'Sociální sítě'
            instagram:
                label: Instagram
                type: text
                span: right
                tab: 'Sociální sítě'
            youtube:
                label: Youtube
                type: text
                span: left
                tab: 'Sociální sítě'
            linkedin:
                label: LinkedIn
                type: text
                span: right
                tab: 'Sociální sítě'
